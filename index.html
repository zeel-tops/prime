<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --cell: #0f3460;
    --cell-hover: #1b4b8a;
    --accent: #e94560;
    --text: #f5f5f5;
    --muted: #a0a0b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 1rem;
  }

  .game {
    background: var(--panel);
    border-radius: 1rem;
    padding: 2rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    max-width: 420px;
    width: 100%;
  }

  h1 {
    margin: 0 0 1rem;
    text-align: center;
    font-size: 1.75rem;
    letter-spacing: 0.05em;
  }

  .status {
    text-align: center;
    font-size: 1.1rem;
    margin-bottom: 1.25rem;
    min-height: 1.5em;
    color: var(--muted);
  }

  .status strong { color: var(--accent); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    aspect-ratio: 1 / 1;
  }

  .cell {
    background: var(--cell);
    border: none;
    border-radius: 0.5rem;
    color: var(--text);
    font-size: clamp(2rem, 12vw, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .cell:not(:disabled):hover {
    background: var(--cell-hover);
  }

  .cell:not(:disabled):active {
    transform: scale(0.97);
  }

  .cell:disabled {
    cursor: not-allowed;
  }

  .cell.win {
    background: var(--accent);
    color: #fff;
  }

  .controls {
    margin-top: 1.25rem;
    display: flex;
    justify-content: center;
  }

  .reset {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .reset:hover { opacity: 0.9; }
</style>
</head>
<body>
  <main class="game" aria-label="Tic Tac Toe game">
    <h1>Tic Tac Toe</h1>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="board" id="board" role="grid"></div>
    <div class="controls">
      <button class="reset" id="reset" type="button">Reset Game</button>
    </div>
  </main>

<script>
  (function () {
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6],
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const resetBtn = document.getElementById("reset");

    let cells = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;
    const cellButtons = [];

    function buildBoard() {
      boardEl.innerHTML = "";
      cellButtons.length = 0;
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        btn.setAttribute("role", "gridcell");
        btn.setAttribute("aria-label", `Cell ${i + 1}, empty`);
        btn.dataset.index = String(i);
        btn.addEventListener("click", onCellClick);
        boardEl.appendChild(btn);
        cellButtons.push(btn);
      }
    }

    function onCellClick(e) {
      const idx = Number(e.currentTarget.dataset.index);
      if (gameOver || cells[idx] !== "") return;

      cells[idx] = currentPlayer;
      const btn = cellButtons[idx];
      btn.textContent = currentPlayer;
      btn.setAttribute("aria-label", `Cell ${idx + 1}, ${currentPlayer}`);

      const winLine = findWinningLine(currentPlayer);
      if (winLine) {
        endGame(`Player ${currentPlayer} wins!`, winLine);
        return;
      }

      if (cells.every((c) => c !== "")) {
        endGame("It's a draw!", null);
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      renderStatus();
    }

    function findWinningLine(player) {
      for (const line of WIN_LINES) {
        if (line.every((i) => cells[i] === player)) return line;
      }
      return null;
    }

    function endGame(message, winLine) {
      gameOver = true;
      statusEl.innerHTML = `<strong>${message}</strong>`;
      cellButtons.forEach((b) => (b.disabled = true));
      if (winLine) winLine.forEach((i) => cellButtons[i].classList.add("win"));
    }

    function renderStatus() {
      statusEl.textContent = `Player ${currentPlayer}'s turn`;
    }

    function reset() {
      cells = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      cellButtons.forEach((btn, i) => {
        btn.textContent = "";
        btn.disabled = false;
        btn.classList.remove("win");
        btn.setAttribute("aria-label", `Cell ${i + 1}, empty`);
      });
      renderStatus();
    }

    resetBtn.addEventListener("click", reset);

    buildBoard();
    renderStatus();
  })();
</script>
</body>
</html>
